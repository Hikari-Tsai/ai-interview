name: Validate contribution
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: https://hikari-tsai.github.io
          BASE_PATH: /ai-interview
